# clave "Ciudad|Centro" como en centros.csv. Curado a mano a partir de la
# columna `horario` del CSV: los horarios partidos, de verano o "bajo peticion"
# no se pueden derivar automaticamente. Si cambia un horario en el CSV, hay
# que actualizarlo tambien aqui. Un centro sin entrada sale sin horario en el
# JSON-LD (nunca se inventa).
