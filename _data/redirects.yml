# Redirecciones. Una sola fuente para dos usos:
#
# prototipo: rutas antiguas del prototipo (los .html de la raiz) -> rutas nuevas.
#   El generador escribe en cada ruta antigua un HTML minimo con meta refresh 0
#   + canonical al destino, que es lo mas parecido a un 301 que permite GitHub
#   Pages. Estan fuera del sitemap y no llevan hreflang.
#   TODO migracion: convertirlas en 301 reales (python _build.py --htaccess).
#
# migracion: rutas de la web viva (www.oficinasya.es, WordPress) -> rutas nuevas.
#   No genera nada hoy. El dia de la migracion, `python _build.py --htaccess`
#   imprime el bloque de 301 para .htaccess o para el plugin Redirection,
#   con las dos listas juntas.

prototipo:
  - { from: /ubicaciones.html,         to: /ubicaciones/ }
  - { from: /comunidad.html,           to: /comunidad/ }
  - { from: /blog.html,                to: /blog/ }
  - { from: /aviso-legal.html,         to: /aviso-legal/ }
  - { from: /privacidad.html,          to: /politica-de-privacidad/ }
  - { from: /cookies.html,             to: /politica-de-cookies/ }
  - { from: /en/locations.html,        to: /en/locations/ }
  - { from: /en/community.html,        to: /en/community/ }
  - { from: /en/blog.html,             to: /en/blog/ }
  - { from: /en/legal-notice.html,     to: /en/legal-notice/ }
  - { from: /en/privacy-policy.html,   to: /en/privacy-policy/ }
  - { from: /en/cookie-policy.html,    to: /en/cookie-policy/ }

