# Las ciudades de la red. `nombre` tiene que coincidir con la columna `ciudad`
# de centros.csv. `slug` y `slug_en` forman las URLs de las paginas de ciudad
# (/oficinas-en-{slug}/ y /en/offices-in-{slug_en}/), que se crean en la fase 4.
# Mientras una ciudad no tenga pagina propia, los enlaces van al hub de
# ubicaciones con el ancla `hub_anchor`. `region` es la comunidad autonoma
# (etiqueta de la tarjeta) y `grupo` la zona por la que el hub agrupa las tarjetas.
#
# Anadir una ciudad = una fila en centros.csv + una entrada aqui (+ su pagina
# en _content/ciudades/ cuando toque).

- { nombre: Madrid,     nombre_en: Madrid,     slug: madrid,     slug_en: madrid,     hub_anchor: madrid, region: "Comunidad de Madrid", region_en: "Community of Madrid", grupo: "Centro", grupo_en: "Centre" }
- { nombre: Barcelona,  nombre_en: Barcelona,  slug: barcelona,  slug_en: barcelona,  hub_anchor: card-barcelona, region: "Cataluña", region_en: "Catalonia", grupo: "Noreste", grupo_en: "North-east" }
