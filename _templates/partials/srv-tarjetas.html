{#- Tarjetas con titulo y texto (dos columnas). Front matter: tarjetas[] (titulo, texto) -#}
<div class="srv-cards {{ 'srv-cards-3' if page.tarjetas | length == 3 else 'srv-cards-2' }} srv-tarjetas">
{%- for x in page.tarjetas %}
  <div class="srv-feature{% if x.get("foto") %} has-photo{% endif %}">{% if x.get("foto") %}<img loading="lazy" decoding="async" width="560" height="373" src="{{ x.foto }}" alt="{{ x.alt }}" />{% endif %}<h3>{{ x.titulo }}</h3><p>{{ x.texto }}</p></div>
{%- endfor %}
</div>
